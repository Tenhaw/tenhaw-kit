name: Synchronise satellites
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      SATELLITES_APP_ID:
        required: true
      SATELLITES_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: Exact published package version
      ref:
        required: true
        type: string
        description: Full reviewed source commit SHA
permissions:
  contents: read
concurrency:
  group: tenhaw-kit-satellite-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate immutable source selection
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          test "$GITHUB_REPOSITORY" = Tenhaw/tenhaw-kit
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the source is reviewed main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Obtain a short-lived token for the six target repositories
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.SATELLITES_APP_ID }}
          private-key: ${{ secrets.SATELLITES_APP_PRIVATE_KEY }}
          owner: Tenhaw
          repositories: |
            tenhaw-gemini
            template-ai-adoption-dashboard
            template-delivery-metrics-dashboard
            template-ai-usecase-register
            template-product-operating-model
            template-ai-readiness-assessment
      - name: Synchronise source snapshots and immutable version tags
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TENHAW_SOURCE_SHA: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/sync-satellites.mjs --apply --version "$RELEASE_VERSION"

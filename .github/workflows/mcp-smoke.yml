name: MCP published-surface smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'
permissions:
  contents: read
jobs:
  protocol-and-live-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify local stdio protocol and all pure tool contracts
        run: pnpm exec vitest run tests/mcp.test.ts
      - name: Verify live remote MCP tools with synthetic inputs
        run: |
          node --input-type=module - <<'JS'
          import {readFile,readdir} from 'node:fs/promises';
          import {validateInput} from './packages/core/dist/index.js';
          import {computeMetrics} from './packages/delivery-metrics/dist/index.js';
          const base='https://mcp.tenhaw.com';
          const health=await fetch(base+'/health',{signal:AbortSignal.timeout(15000)});
          if(!health.ok)throw new Error('Remote health endpoint is unavailable.');
          const status=await health.json();
          if(status.status!=='ok'||status.commit!==process.env.GITHUB_SHA)throw new Error('Remote endpoint does not identify the reviewed main source commit.');
          let id=0,protocol='2025-11-25',session;
          async function rpc(method,params,notification=false){
            const next=notification?undefined:++id;
            const response=await fetch(base+'/mcp',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json, text/event-stream','MCP-Protocol-Version':protocol,...(session?{'MCP-Session-Id':session}:{})},body:JSON.stringify({jsonrpc:'2.0',...(next===undefined?{}:{id:next}),method,params}),signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw new Error(`Remote MCP ${method} returned HTTP ${response.status}.`);
            session=response.headers.get('MCP-Session-Id')??session;
            if(notification)return;
            const body=await response.text();let message;
            if(response.headers.get('content-type')?.includes('application/json'))message=JSON.parse(body);
            else message=body.split(/\r?\n/).filter(line=>line.startsWith('data:')).map(line=>JSON.parse(line.slice(5).trim())).find(value=>value.id===next);
            if(!message||message.error)throw new Error(`Remote MCP ${method} did not return a successful protocol response.`);
            return message.result;
          }
          const init=await rpc('initialize',{protocolVersion:protocol,capabilities:{},clientInfo:{name:'tenhaw-live-smoke',version:'1.0.0'}});protocol=init.protocolVersion;
          await rpc('notifications/initialized',{},true);
          const inventory=await rpc('tools/list',{});
          const expected=['assess_ai_readiness','score_delivery_health','estimate_ai_roi','estimate_ai_project_cost','generate_usecase_register','generate_operating_model'];
          if(JSON.stringify(inventory.tools.map(tool=>tool.name).sort())!==JSON.stringify([...expected].sort()))throw new Error('Remote inventory must expose exactly six pure tools.');
          const roi=JSON.parse(await readFile('spec/vectors/roi/'+(await readdir('spec/vectors/roi')).sort()[0],'utf8')).input;
          const metrics=computeMetrics([],{since:'2026-01-01T00:00:00Z',until:'2026-02-01T00:00:00Z'});
          for(const[name,input,schema]of [['assess_ai_readiness',{responses:{answers:[]}},'readiness-report'],['assess_ai_readiness',{mode:'questionnaire'},'readiness-questionnaire'],['score_delivery_health',{metrics},'delivery-health'],['estimate_ai_roi',roi,'roi-report'],['estimate_ai_project_cost',{stage:'poc'},'project-cost-report'],['generate_usecase_register',{useCases:[]},'usecase-register-report'],['generate_operating_model',{teams:[]},'opmodel-report']]){
            const output=await rpc('tools/call',{name,arguments:input});if(output.isError)throw new Error(`Remote ${name} returned a tool error.`);validateInput(schema,output.structuredContent?.result);
          }
          console.log('Live MCP handshake, exact six-tool inventory and seven synthetic schema-validated calls passed.');
          JS

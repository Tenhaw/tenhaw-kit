name: Publish official MCP registry metadata
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Exact npm and deployed remote MCP version
permissions:
  contents: read
concurrency:
  group: tenhaw-mcp-registry
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the reviewed source and configured HTTP identity
        env:
          HTTP_CONFIGURED: ${{ vars.MCP_HTTP_AUTH_CONFIGURED }}
        run: |
          test "$GITHUB_REPOSITORY" = Tenhaw/tenhaw-kit
          test "$GITHUB_REF" = refs/heads/main
          test "$HTTP_CONFIGURED" = true
          jq --exit-status --arg version "$RELEASE_VERSION" '.name == "com.tenhaw/kit" and .version == $version' packages/mcp/server.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Verify the underlying package and live endpoint
        run: |
          set -euo pipefail
          npm view "@tenhaw/mcp@$RELEASE_VERSION" version --json | jq --exit-status --arg version "$RELEASE_VERSION" '. == $version'
          curl --fail --silent --show-error https://mcp.tenhaw.com/health | jq --exit-status --arg version "$RELEASE_VERSION" --arg commit "$GITHUB_SHA" '.status == "ok" and .version == $version and .commit == $commit'
      - name: Install the pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, official registry example
      - name: Download and verify the pinned publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$MCP_PUBLISHER_VERSION" --repo modelcontextprotocol/registry --pattern mcp-publisher_linux_amd64.tar.gz --pattern mcp-publisher_linux_amd64.tar.gz.sigstore.json --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          echo '4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  '"$archive" | sha256sum --check
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Authenticate without printing private material and publish
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          import {createPrivateKey,createPublicKey} from 'node:crypto';
          const key=process.env.MCP_PRIVATE_KEY;
          if(!key||!/^[0-9a-f]{64}$/i.test(key))throw new Error('Configure the protected release environment MCP_PRIVATE_KEY as an Ed25519 hex seed.');
          const privateKey=createPrivateKey({key:Buffer.concat([Buffer.from('302e020100300506032b657004220420','hex'),Buffer.from(key,'hex')]),type:'pkcs8',format:'der'});
          const publicBytes=createPublicKey(privateKey).export({type:'spki',format:'der'}).subarray(-32);
          const expected='v=MCPv1; k=ed25519; p='+publicBytes.toString('base64');
          const proof=await fetch('https://tenhaw.com/.well-known/mcp-registry-auth',{headers:{Accept:'text/plain','User-Agent':'mcp-registry/1.0'},redirect:'error',signal:AbortSignal.timeout(10000)});
          if(proof.status!==200)throw new Error('The public HTTP identity proof must return 200 without redirects.');
          const record=await proof.text();
          if(Buffer.byteLength(record)>4096||record.trim()!==expected)throw new Error('The public HTTP proof does not match the protected signing key.');
          const binary=process.env.RUNNER_TEMP+'/mcp-publisher',publisherEnv={...process.env};delete publisherEnv.MCP_PRIVATE_KEY;
          try{execFileSync(binary,['login','http','--domain','tenhaw.com','--private-key',key],{stdio:'ignore',env:publisherEnv});}
          catch{throw new Error('HTTP authentication failed. Check the public well-known proof and protected environment key; no private material was logged.');}
          execFileSync(binary,['validate'],{cwd:'packages/mcp',stdio:'inherit',env:publisherEnv});
          execFileSync(binary,['publish'],{cwd:'packages/mcp',stdio:'inherit',env:publisherEnv});
          JS
      - name: Verify exact registry identity and version
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://registry.modelcontextprotocol.io/v0.1/servers?search=com.tenhaw%2Fkit' | jq --exit-status --arg version "$RELEASE_VERSION" '.servers | any(.server.name == "com.tenhaw/kit" and .server.version == $version)'
      - name: Remove the ephemeral registry session
        if: always()
        run: rm -f "$HOME/.config/mcp-publisher/token.json"

name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '25 7 * * 1'
permissions:
  contents: read
jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/.next/**'
              - packages/cli/templates
      - uses: github/codeql-action/analyze@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          category: /language:${{ matrix.language }}

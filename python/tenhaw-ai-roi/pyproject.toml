[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tenhaw-ai-roi"
version = "1.1.0"
description = "Explainable AI business cases separating cash savings and recovered capacity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-CONTENT"]
authors = [{ name = "Tenhaw", email = "hello@tenhaw.com" }]
dependencies = ["jsonschema>=4.23"]
keywords = ["ai-roi", "roi-calculator", "business-case", "internal-tools", "tenhaw"]

[project.urls]
Homepage = "https://kit.tenhaw.com/tools/ai-roi"
Repository = "https://github.com/Tenhaw/tenhaw-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/tenhaw_ai_roi"]
